# GitHub Actions Workflow for Deploying Vite React SPA to GitHub Pages
# Official Docs:
# - GitHub Pages with Actions: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
# - actions/deploy-pages: https://github.com/actions/deploy-pages
# - actions/upload-pages-artifact: https://github.com/actions/upload-pages-artifact

name: Deploy to GitHub Pages

on:
  # Automatically run whenever code is pushed to the main branch
  push:
    branches: [ main ]

  # Enables the "Run workflow" button in the GitHub Actions tab for manual runs
  workflow_dispatch:

# Permissions required for the official GitHub Pages deployment action
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent simultaneous deployments from cancelling or overwriting each other out of order
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Add Custom CNAME & SPA 404 Fallback
        run: |
          echo "ide.freshfood.rocks" > dist/CNAME
          cp dist/index.html dist/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
